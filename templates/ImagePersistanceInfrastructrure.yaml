
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Data layer for the photogrammetry service. Provisions the S3 bucket that
  stores image bytes, the RDS MySQL instance that stores image metadata, and
  the security group attached to the instance. The VPC and subnets come from
  the network stack, and the workloads (query instance, capture Lambda) add
  their own ingress rules. Credentials are supplied as stack parameters; no
  Secrets Manager resources are created.

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC shared with the query instance and the capture Lambda.

  DbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Private subnets for the database subnet group. RDS requires subnets in at
      least two availability zones.

  ImageBucketName:
    Type: String
    Default: ''
    Description: >
      Globally unique, lowercase name for the image bucket. Leave empty to
      derive it from the region and account id.

  DbName:
    Type: String
    Default: imagemetadata
    Description: >
      Name of the database to create on the instance. RDS only allows letters
      and numbers here.

  DbUser:
    Type: String
    Default: admin
    Description: Master username for the RDS instance.

  DbPassword:
    Type: String
    NoEcho: true
    Description: Master password for the RDS instance.

  DbInstanceClass:
    Type: String
    Default: db.t3.micro

  DbAllocatedStorage:
    Type: Number
    Default: 20


Conditions:

  HasImageBucketName: !Not [!Equals [!Ref ImageBucketName, '']]


Resources:

  ImgCollectBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !If
        - HasImageBucketName
        - !Ref ImageBucketName
        - !Sub '${AWS::Region}-img-collect-bucket-${AWS::AccountId}'
      # The browser PUTs to a pre-signed URL, so the bucket needs a CORS rule
      # for the cross-origin request from the CloudFront frontend.
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  ImgCollectDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the image metadata database
      SubnetIds: !Ref DbSubnetIds

  ## The query instance and the capture Lambda add their own ingress rules, so
  ## this group starts with no inbound access.
  ImgCollectDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ingress rules for the image metadata database
      VpcId: !Ref VpcId

  ImgCollectDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::Region}-image-collect-db'
      DBInstanceClass: !Ref DbInstanceClass
      Engine: mysql
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp2
      DBName: !Ref DbName
      MasterUsername: !Ref DbUser
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref ImgCollectDBSubnetGroup
      VPCSecurityGroups:
        - !Ref ImgCollectDBSecurityGroup
      PubliclyAccessible: false

Outputs:

  BucketName:
    Description: Bucket that stores image bytes.
    Value:
      Ref: ImgCollectBucket
    Export:
      Name: photogrammetry-image-bucket

  BucketArn:
    Description: ARN of the bucket that stores image bytes.
    Value: !GetAtt ImgCollectBucket.Arn
    Export:
      Name: photogrammetry-image-bucket-arn

  DBHost:
    Description: RDS endpoint hostname for the image metadata database.
    Value:
      !GetAtt ImgCollectDB.Endpoint.Address
    Export:
      Name: photogrammetry-db-host

  DBName:
    Description: Database holding the images table.
    Value:
      !Ref DbName
    Export:
      Name: photogrammetry-db-name

  DBSecurityGroupId:
    Description: Security group attached to the RDS instance.
    Value:
      !Ref ImgCollectDBSecurityGroup
    Export:
      Name: photogrammetry-db-security-group-id
